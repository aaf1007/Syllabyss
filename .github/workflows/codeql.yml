# CodeQL code scanning (advanced setup): TypeScript/JavaScript and the workflow files.
# Findings show in Security → Code scanning and as a check on PRs. Keep the repo's CodeQL
# "Default setup" off: it can't run alongside this workflow.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC: new queries catch issues in unchanged code
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none # interpreted languages: no build needed
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
